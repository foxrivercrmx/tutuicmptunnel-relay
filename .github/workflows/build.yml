name: Build Tutu Relay Backend

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger tambahan agar workflow berjalan saat Anda mem-push tag (misal: v1.0.0)
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64] 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0 
        run: |
          go build -ldflags="-s -w" -o tutu-relay-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tutu-relay-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tutu-relay-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build # Job ini akan menunggu job 'build' selesai
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # Hanya berjalan jika yang di-push adalah tag
    permissions:
      contents: write # Wajib agar bot bisa membuat Release

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true # Menggabungkan semua file dari matrix ke dalam satu folder

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: ./artifacts/*